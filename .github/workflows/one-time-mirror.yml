name: One-time mirror from supersoft

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  mirror:
    if: github.repository == 'forest899/softsoftsoftsoft'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source main to target main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror https://github.com/forest899/supersoft.git source.git
          cd source.git
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/forest899/softsoftsoftsoft.git" refs/heads/main:refs/heads/main
